      content: "**Indiener (bedrijfsleider):**  \nNathan Bijnens & Femke Verfaillie  \nSint-Kruis-Winkeldorp 84  \n9042 Gent  \nIBAN: **BE52 1430 8296 4609**\n\n**Vennootschap:**  \nVorward BV  \nSint-Kruis-Winkeldorp 84  \n9042 Gent  \nBTW BE1031038437\n"
    - type: glance
      columns: 3
      show_name: true
      show_icon: true
      entities:
      - entity: sensor.car_charger_energy_monthly
        attribute: last_period
        name: Verbruik
        icon: mdi:ev-station
      - entity: input_number.electricity_injection_creg_kwh
        name: CREG-tarief
        icon: mdi:currency-eur
