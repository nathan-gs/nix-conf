      heading: New section
    - graph: line
      type: sensor
      detail: 1
      entity: sensor.outdoor_temperature
      name: Temperatuur (Buiten)
      icon: mdi:sun-thermometer
      hours_to_show: 24
- title: EV Kostennota Vorward BV
