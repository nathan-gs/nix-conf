- type: sections
  max_columns: 8
  title: Tuin
  path: tuin
  icon: mdi:shovel
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Grasmaaier
      heading_style: title
      icon: mdi:robot-mower
    - type: tile
      entity: lawn_mower.indego_325608617
    - type: tile
      entity: sensor.indego_325608617_lawn_mowed
    - type: tile
      entity: sensor.indego_325608617_last_completed
    - type: tile
      entity: sensor.indego_325608617_battery_percentage
    - type: tile
      entity: sensor.indego_runtime_weekly
    - type: tile
      entity: sensor.indego_325608617_mower_state
    - type: tile
      entity: sensor.indego_325608617_mower_state_detail
    - graph: line
      type: sensor
      detail: 1
      entity: sensor.indego_325608617_lawn_mowed
      hours_to_show: 72
      name: Gras Gemaaid
    - type: tile
      entity: automation.garden_lawn_mower_turn_on
      state_content: last_triggered
      show_entity_picture: false
      icon: mdi:robot-mower
      color: disabled
      tap_action:
        action: navigate
        navigation_path: /config/automation/trace/garden_lawn_mower_turn_on
      icon_tap_action:
        action: none
      hold_action:
        action: none
  - type: grid
