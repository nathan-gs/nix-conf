# YAML-mode dashboard, registered from smarthome/dashboards.nix.
# Not editable in the UI: edit this file and switch.
# Same URL as the existing sidebar dashboard, so the storage copy is hidden.
views:
- title: Home
  cards:
  - type: vertical-stack
    cards:
    - type: grid
      cards:
      - show_name: true
        show_icon: true
        type: button
        tap_action:
          action: call-service
          service: hon.start_program
          target:
            device_id: 6522a71c380d6b17f42bffd5b0645999
          data:
            parameters: "{'extraDry':'1','openDoor':'0','delayTime':'0'}"
            program: intensive_rapid
        name: Intensive Rapid (Extra Dry)
        show_state: false
        icon: mdi:dishwasher
        entity: binary_sensor.dishwasher_status
      - show_name: true
        show_icon: true
        type: button
        tap_action:
          action: call-service
          service: hon.start_program
          target:
            device_id: 6522a71c380d6b17f42bffd5b0645999
          data:
            parameters: "{'extraDry':'0','openDoor':'1','delayTime':'0'}"
            program: intensive_rapid
        name: Intensive Rapid (Open Door)
        show_state: false
        icon: mdi:dishwasher
        entity: binary_sensor.dishwasher_status
      - type: gauge
        entity: sensor.floor0_keuken_metering_plug_vaatwas_power
        needle: false
        name: Vaatwas
    - type: entities
      entities:
      - sensor.dishwasher_end_time
      - sensor.dishwasher_error
      - sensor.dishwasher_mode
      - sensor.dishwasher_program
      - sensor.dishwasher_program_phase
      - sensor.dishwasher_remaining_time
      - binary_sensor.dishwasher_remote_control
      - binary_sensor.dishwasher_status
    - type: custom:apexcharts-card
      graph_span: 3h
      header:
        show: false
        title: Verbruik laatste 3 uur
      apex_config:
        yaxis:
        - id: first
          forceNiceScale: true
          decimalsInFloat: 0
          opposite: false
          name: Energie
      all_series_config:
        stroke_width: 1
      series:
      - entity: sensor.floor0_keuken_metering_plug_vaatwas_power
        unit: W
        type: line
        name: Vaatwas
        group_by:
          func: median
          duration: 1m
          fill: last
      - entity: sensor.dishwasher_power
        unit: W
        type: line
        name: Vaatwas
        group_by:
          func: median
          duration: 1m
          fill: last
        show:
          datalabels: false
          extremas: true
  - type: vertical-stack
    cards:
    - type: entities
      entities:
      - entity: sensor.aeg_wasmachine_timetoend_2
      - entity: sensor.aeg_wasmachine_appliancestate_2
      - entity: sensor.aeg_wasmachine_cyclephase_2
      - entity: sensor.aeg_wasmachine_cyclesubphase_2
    - type: custom:apexcharts-card
      graph_span: 3h
      header:
        show: false
        title: Verbruik laatste 3 uur
      apex_config:
        yaxis:
        - id: first
          forceNiceScale: true
          decimalsInFloat: 0
          opposite: false
          name: Energie
      all_series_config:
        stroke_width: 1
      series:
      - entity: sensor.floor1_waskot_metering_plug_wasmachine_power
        unit: W
        type: line
        name: Wasmachine
        group_by:
          func: median
          duration: 1m
          fill: last
        show:
          datalabels: false
          extremas: true
