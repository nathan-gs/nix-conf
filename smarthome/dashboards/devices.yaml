        attribute: last_period
        name: Totaal
        icon: mdi:hand-coin
  - type: markdown
    content: |
      ---

      ### Overzicht laadkosten (vorige maand)

      | Omschrijving                          | Details                                              | Bedrag              |
      |---------------------------------------|------------------------------------------------------|---------------------|
      | Verbruik thuisladen EV                | {{ state_attr('sensor.car_charger_energy_monthly', 'last_period') | float | round(1) }} kWh |                     |
      | Toegepast CREG-tarief                 | {{ states('input_number.electricity_injection_creg_kwh') }} €/kWh<br>(Vlaanderen - tarief vorige maand) |                     |
      | **Totaal terug te betalen (ex-BTW)**  |                                                      | **€ {{ (state_attr('sensor.car_charger_energy_monthly', 'last_period') | float(0) * states('input_number.electricity_injection_creg_kwh') | float(0)) | round(2) }}** |
