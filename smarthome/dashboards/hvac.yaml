              - entity: sensor.indoor_humidity_max
                name: Indoor Humidity (max)
                type: line
                group_by:
                  func: max
                  duration: 5m
                stroke_width: 2
                yaxis_id: humidity
          - type: custom:apexcharts-card
            graph_span: 24h
            show:
              last_updated: true
            yaxis:
              - id: temperature
                apex_config:
                  forceNiceScale: true
                  decimalsInFloat: 0
