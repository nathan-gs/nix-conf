# Server health dashboard — services/server-health2mqtt.nix.
#
# Registered as a YAML-mode dashboard from smarthome/system/servers.nix, so it
# is NOT editable in the HA UI: edit this file and switch. The default
# dashboard stays storage-mode/UI-managed; this one is additional.
#
# Uses the sections view type (heading/tile cards), not the old masonry layout
# the other dashboards in this directory use.
#
# Host names are hardcoded — there are two servers and they are named in
# computers/. Disk *inventory* is not: those rows come from auto-entities
# filters on the entity-id shape, so a replaced or added disk shows up here
# with no edit, matching how the alerting in smarthome/system/servers.nix works.
title: Server health

views:
  # One column per host: nhtpc left, nnas right, each with its own btrfs block
  # underneath. Sections are dealt into columns in order, so max_columns: 2
  # with the hosts first is what pins the sides; anything added after them must
  # either belong to a host or span both columns.
  - title: Overview
    path: overview
    type: sections
    max_columns: 2
    icon: mdi:server
    badges:
      - type: entity
        entity: binary_sensor.system_network_servers_problem
        name: Problems
        color: red
      - type: entity
        entity: binary_sensor.system_network_servers_unreachable
        name: Reporting
        color: red

    sections:
      - type: grid
        cards:
          - type: heading
            heading: nhtpc
            heading_style: title
            icon: mdi:server
            badges:
              - type: entity
                entity: binary_sensor.system_network_server_nhtpc_problem
          - type: tile
            entity: sensor.system_network_server_nhtpc_cpu_used
            name: CPU
          - type: tile
            entity: sensor.system_network_server_nhtpc_cpu_iowait
            name: IO wait
          - type: tile
            entity: sensor.system_network_server_nhtpc_cpu_temperature
            name: CPU temp
          - type: tile
            entity: sensor.system_network_server_nhtpc_memory_used
            name: Memory
          - type: tile
            entity: sensor.system_network_server_nhtpc_swap_used
            name: Swap
          - type: tile
            entity: sensor.system_network_server_nhtpc_root_fs_used
            name: Root fs
          - type: tile
            entity: sensor.system_network_server_nhtpc_uptime
            name: Uptime
          - type: tile
            entity: sensor.system_network_server_nhtpc_failed_units
            name: Failed units
          - type: tile
            entity: binary_sensor.system_network_server_nhtpc_reboot_required
            name: Reboot required
          # Filesystem-wide, not per-volume: every volume is a subvolume of the
          # same multi-device filesystem.
          - type: heading
            heading: Btrfs
            heading_style: subtitle
            icon: mdi:harddisk
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_used
            name: Used
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_free
            name: Free
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_device_errors
            name: Device errors
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_devices_missing
            name: Devices missing
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_scrub_age
            name: Scrub age
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_scrub_status
            name: Scrub status

          - type: heading
            heading: Open problems
            heading_style: subtitle
            icon: mdi:alert
          - type: markdown
            content: >-
              {% set ns = namespace(lines=[]) %}

              {% for e in states.binary_sensor
                   | selectattr('entity_id','search','^binary_sensor\\.system_network_server_nhtpc_')
                   | selectattr('attributes.device_class','defined')
                   | selectattr('attributes.device_class','eq','problem')
                   | rejectattr('entity_id','search','_reboot_required$')
                   | selectattr('state','eq','on') %}

              {% for p in (e.attributes.problems | default([])) %}

              {% set ns.lines = ns.lines + [p] %}

              {% endfor %}

              {% endfor %}

              {% if ns.lines %}

              {% for l in ns.lines %}

              - {{ l }}

              {% endfor %}

              {% else %}

              No problems reported.

              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: nnas
            heading_style: title
            icon: mdi:nas
            badges:
              - type: entity
                entity: binary_sensor.system_network_server_nnas_problem
          - type: tile
            entity: sensor.system_network_server_nnas_cpu_used
            name: CPU
          - type: tile
            entity: sensor.system_network_server_nnas_cpu_iowait
            name: IO wait
          - type: tile
            entity: sensor.system_network_server_nnas_cpu_temperature
            name: CPU temp
          - type: tile
            entity: sensor.system_network_server_nnas_memory_used
            name: Memory
          - type: tile
            entity: sensor.system_network_server_nnas_swap_used
            name: Swap
          - type: tile
            entity: sensor.system_network_server_nnas_root_fs_used
            name: Root fs
          - type: tile
            entity: sensor.system_network_server_nnas_uptime
            name: Uptime
          - type: tile
            entity: sensor.system_network_server_nnas_failed_units
            name: Failed units
          - type: tile
            entity: binary_sensor.system_network_server_nnas_reboot_required
            name: Reboot required
          - type: heading
            heading: Btrfs
            heading_style: subtitle
            icon: mdi:harddisk
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_used
            name: Used
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_free
            name: Free
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_device_errors
            name: Device errors
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_devices_missing
            name: Devices missing
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_scrub_age
            name: Scrub age
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_scrub_status
            name: Scrub status

          - type: heading
            heading: Open problems
            heading_style: subtitle
            icon: mdi:alert
          - type: markdown
            content: >-
              {% set ns = namespace(lines=[]) %}

              {% for e in states.binary_sensor
                   | selectattr('entity_id','search','^binary_sensor\\.system_network_server_nnas_')
                   | selectattr('attributes.device_class','defined')
                   | selectattr('attributes.device_class','eq','problem')
                   | rejectattr('entity_id','search','_reboot_required$')
                   | selectattr('state','eq','on') %}

              {% for p in (e.attributes.problems | default([])) %}

              {% set ns.lines = ns.lines + [p] %}

              {% endfor %}

              {% endfor %}

              {% if ns.lines %}

              {% for l in ns.lines %}

              - {{ l }}

              {% endfor %}

              {% else %}

              No problems reported.

              {% endif %}

  # One column per host, nhtpc left and nnas right, with the *same* subheadings
  # in the same order in both so the two columns read across even though the
  # hosts have different disk counts (nhtpc 4, nnas 3) — the columns end at
  # different heights, the rows still line up group for group.
  #
  # Within a column the disks come from auto-entities filters on the entity-id
  # shape rather than being listed, so swapping a drive needs no edit here.
  # show_empty hides a group a host has nothing for (only the NVMe root
  # reports wear), rather than leaving an empty card under its heading.
  # Laid out as rows, not as one column per host.
  #
  # Two column-sections (nhtpc | nnas) drift apart vertically as soon as the
  # hosts have different disk counts — nhtpc has 4 disks and nnas 3, so every
  # group after the first sat at a different height on each side. Instead each
  # metric is a full-width row (column_span: 2) holding a horizontal-stack of
  # the two hosts, so both start at the same y and the next row begins below
  # the taller of the pair. nhtpc stays left, nnas right, and the alignment
  # holds however many disks either host has.
  #
  # Disks come from auto-entities filters on the entity-id shape, so swapping a
  # drive needs no edit here.
  - title: Disks
    path: disks
    type: sections
    max_columns: 2
    icon: mdi:harddisk

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: SMART health
            heading_style: title
            icon: mdi:heart-pulse
          - type: horizontal-stack
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nhtpc
                  state_color: true
                filter:
                  include:
                    - entity_id: binary_sensor.system_network_server_nhtpc_disk_*_problem
                  exclude: []
                sort:
                  method: friendly_name
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nnas
                  state_color: true
                filter:
                  include:
                    - entity_id: binary_sensor.system_network_server_nnas_disk_*_problem
                  exclude: []
                sort:
                  method: friendly_name
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Reallocated sectors and media errors
            heading_style: title
            icon: mdi:alert-octagon-outline
          - type: horizontal-stack
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nhtpc
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nhtpc_disk_*_reallocated
                    - entity_id: sensor.system_network_server_nhtpc_disk_*_media_errors
                  exclude: []
                sort:
                  method: state
                  numeric: true
                  reverse: true
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nnas
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nnas_disk_*_reallocated
                    - entity_id: sensor.system_network_server_nnas_disk_*_media_errors
                  exclude: []
                sort:
                  method: state
                  numeric: true
                  reverse: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Temperature
            heading_style: title
            icon: mdi:thermometer
          - type: horizontal-stack
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nhtpc
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nhtpc_disk_*_temperature
                  exclude: []
                sort:
                  method: state
                  numeric: true
                  reverse: true
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nnas
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nnas_disk_*_temperature
                  exclude: []
                sort:
                  method: state
                  numeric: true
                  reverse: true
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Standby
            heading_style: title
            icon: mdi:sleep
          - type: horizontal-stack
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nhtpc
                  state_color: true
                filter:
                  include:
                    - entity_id: binary_sensor.system_network_server_nhtpc_disk_*_standby
                  exclude: []
                sort:
                  method: friendly_name
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nnas
                  state_color: true
                filter:
                  include:
                    - entity_id: binary_sensor.system_network_server_nnas_disk_*_standby
                  exclude: []
                sort:
                  method: friendly_name
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Last SMART read
            heading_style: title
            icon: mdi:clock-check-outline
          - type: horizontal-stack
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nhtpc
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nhtpc_disk_*_smart_updated
                  exclude: []
                sort:
                  method: friendly_name
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nnas
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nnas_disk_*_smart_updated
                  exclude: []
                sort:
                  method: friendly_name
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hours and wear
            heading_style: title
            icon: mdi:chart-donut
          - type: horizontal-stack
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nhtpc
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nhtpc_disk_*_power_on_hours
                    - entity_id: sensor.system_network_server_nhtpc_disk_*_wear
                  exclude: []
                sort:
                  method: state
                  numeric: true
                  reverse: true
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: nnas
                filter:
                  include:
                    - entity_id: sensor.system_network_server_nnas_disk_*_power_on_hours
                    - entity_id: sensor.system_network_server_nnas_disk_*_wear
                  exclude: []
                sort:
                  method: state
                  numeric: true
                  reverse: true
