# Server health dashboard — services/server-health2mqtt.nix.
#
# Registered as a YAML-mode dashboard from smarthome/system/servers.nix, so it
# is NOT editable in the HA UI: edit this file and switch. The default
# dashboard stays storage-mode/UI-managed; this one is additional.
#
# Uses the sections view type (heading/tile cards), not the old masonry layout
# the other dashboards in this directory use.
#
# Host names are hardcoded — there are two servers and they are named in
# computers/. Disk *inventory* is not: those rows come from auto-entities
# filters on the entity-id shape, so a replaced or added disk shows up here
# with no edit, matching how the alerting in smarthome/system/servers.nix works.
title: Server health

views:
  - title: Overview
    path: overview
    type: sections
    max_columns: 2
    icon: mdi:server
    badges:
      - type: entity
        entity: binary_sensor.system_network_servers_problem
        name: Problems
        color: red
      - type: entity
        entity: binary_sensor.system_network_servers_unreachable
        name: Reporting
        color: red

    sections:
      - type: grid
        cards:
          - type: heading
            heading: nhtpc
            heading_style: title
            icon: mdi:server
            badges:
              - type: entity
                entity: binary_sensor.system_network_server_nhtpc_problem
          - type: tile
            entity: sensor.system_network_server_nhtpc_cpu_used
            name: CPU
          - type: tile
            entity: sensor.system_network_server_nhtpc_cpu_iowait
            name: IO wait
          - type: tile
            entity: sensor.system_network_server_nhtpc_cpu_temperature
            name: CPU temp
          - type: tile
            entity: sensor.system_network_server_nhtpc_chipset_temperature
            name: Chipset temp
          - type: tile
            entity: sensor.system_network_server_nhtpc_memory_used
            name: Memory
          - type: tile
            entity: sensor.system_network_server_nhtpc_swap_used
            name: Swap
          - type: tile
            entity: sensor.system_network_server_nhtpc_root_fs_used
            name: Root fs
          - type: tile
            entity: sensor.system_network_server_nhtpc_uptime
            name: Uptime
          - type: tile
            entity: sensor.system_network_server_nhtpc_failed_units
            name: Failed units
          - type: tile
            entity: binary_sensor.system_network_server_nhtpc_reboot_required
            name: Reboot required

      - type: grid
        cards:
          - type: heading
            heading: nnas
            heading_style: title
            icon: mdi:nas
            badges:
              - type: entity
                entity: binary_sensor.system_network_server_nnas_problem
          - type: tile
            entity: sensor.system_network_server_nnas_cpu_used
            name: CPU
          - type: tile
            entity: sensor.system_network_server_nnas_cpu_iowait
            name: IO wait
          - type: tile
            entity: sensor.system_network_server_nnas_cpu_temperature
            name: CPU temp
          - type: tile
            entity: sensor.system_network_server_nnas_chipset_temperature
            name: Chipset temp
          - type: tile
            entity: sensor.system_network_server_nnas_memory_used
            name: Memory
          - type: tile
            entity: sensor.system_network_server_nnas_swap_used
            name: Swap
          - type: tile
            entity: sensor.system_network_server_nnas_root_fs_used
            name: Root fs
          - type: tile
            entity: sensor.system_network_server_nnas_uptime
            name: Uptime
          - type: tile
            entity: sensor.system_network_server_nnas_failed_units
            name: Failed units
          - type: tile
            entity: binary_sensor.system_network_server_nnas_reboot_required
            name: Reboot required

      # All volumes are subvolumes of one filesystem per host, so these are
      # filesystem-wide figures, not per-volume.
      - type: grid
        cards:
          - type: heading
            heading: Btrfs
            heading_style: title
            icon: mdi:harddisk
          - type: heading
            heading: nhtpc
            heading_style: subtitle
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_used
            name: Used
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_free
            name: Free
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_device_errors
            name: Device errors
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_devices_missing
            name: Devices missing
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_scrub_age
            name: Scrub age
          - type: tile
            entity: sensor.system_network_server_nhtpc_btrfs_scrub_status
            name: Scrub status
          - type: heading
            heading: nnas
            heading_style: subtitle
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_used
            name: Used
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_free
            name: Free
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_device_errors
            name: Device errors
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_devices_missing
            name: Devices missing
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_scrub_age
            name: Scrub age
          - type: tile
            entity: sensor.system_network_server_nnas_btrfs_scrub_status
            name: Scrub status

      - type: grid
        cards:
          - type: heading
            heading: Open problems
            heading_style: title
            icon: mdi:alert
          - type: markdown
            content: >-
              {% set problems =
                state_attr('binary_sensor.system_network_servers_problem','problems') %}
              {% if problems %}
              {% for p in problems %}
              - {{ p }}
              {% endfor %}
              {% else %}
              No problems reported.
              {% endif %}

  - title: Disks
    path: disks
    type: sections
    max_columns: 2
    icon: mdi:harddisk

    sections:
      # Inventory-free: anything matching the entity-id shape appears, so a
      # disk swap needs no dashboard edit.
      - type: grid
        cards:
          - type: heading
            heading: SMART health
            heading_style: title
            icon: mdi:heart-pulse
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.system_network_server_*_disk_*_problem
              exclude: []
            sort:
              method: friendly_name

      - type: grid
        cards:
          - type: heading
            heading: Temperature
            heading_style: title
            icon: mdi:thermometer
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: sensor.system_network_server_*_disk_*_temperature
              exclude: []
            sort:
              method: state
              numeric: true
              reverse: true

      # A disk that is asleep is skipped rather than woken, so its SMART record
      # is deliberately stale. "SMART updated" is how you tell a stale record
      # from a broken one — do not read an old timestamp here as a fault.
      - type: grid
        cards:
          - type: heading
            heading: Standby / last SMART read
            heading_style: title
            icon: mdi:sleep
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.system_network_server_*_disk_*_standby
              exclude: []
            sort:
              method: friendly_name
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: sensor.system_network_server_*_disk_*_smart_updated
              exclude: []
            sort:
              method: friendly_name

      - type: grid
        cards:
          - type: heading
            heading: Wear and hours
            heading_style: title
            icon: mdi:chart-donut
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: sensor.system_network_server_*_disk_*_wear
              exclude: []
            sort:
              method: state
              numeric: true
              reverse: true
          - type: custom:auto-entities
            card:
              type: entities
            filter:
              include:
                - entity_id: sensor.system_network_server_*_disk_*_power_on_hours
              exclude: []
            sort:
              method: state
              numeric: true
              reverse: true
