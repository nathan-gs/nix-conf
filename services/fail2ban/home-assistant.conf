[Definition]
# HA logs: "... from <ptr-or-ip> (<ADDR>). Requested URL: '...'. (user-agent)"
# <HOST> after "from" grabs the PTR's leading octets (e.g. reversed
# *.bc.googleusercontent.com) and misses names with no IPv4 prefix.
failregex = ^.*\[homeassistant\.components\.http\.ban\] Login attempt or request with invalid authentication from \S+ \(<ADDR>\)
            ^.*\[homeassistant\.components\.http\.ban\] Banned IP <ADDR>

ignoreregex =

# Unit only: comm is `.hass-wrapped` on NixOS, not `home-assistant`.
journalmatch = _SYSTEMD_UNIT=home-assistant.service

datepattern = {^LN-BEG}
