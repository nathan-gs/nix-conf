# fail2ban filter: nginx denied a request by an access rule.
#
# Named "-custom" (like nginx-http-auth-custom) because fail2ban ships its own
# nginx-forbidden.conf. environment.etc cannot shadow it -- /etc/fail2ban/filter.d
# entries that collide with a name in the package resolve to the package's copy,
# silently -- so a filter here must not reuse an upstream name. Upstream's
# version has an empty ignoreregex and would ban on the internal names below.
#
# Emitted by ngx_http_access_module, i.e. by homeNetwork.nginxLanOnly
# ("allow <trustedSources>; deny all;") -- see home-network.nix. Since
# dns.nathan.gs is also the default server, every request arriving with an
# unknown or spoofed Host header lands there and is denied too. Both cases
# mean the same thing: a client outside the LAN/VPN asking for something it
# was never meant to reach. In practice that is exclusively vulnerability
# scanners -- .env / .aws/credentials / phpinfo wordlists against the bare
# WAN address or against names that have no vhost.

[Definition]

failregex = ^.*\[error\] \d+#\d+: \*\d+ access forbidden by rule, client: <HOST>, server:

# A roaming phone off the VPN hitting an internal name is a user mistake, not
# a scanner -- do not ban the user's mobile carrier for it.
ignoreregex = host: "[^"]+\.(l|wg)\.nathan\.gs"

datepattern = {^LN-BEG}

journalmatch = _SYSTEMD_UNIT=nginx.service + _COMM=nginx
